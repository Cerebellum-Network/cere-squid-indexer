manifestVersion: subsquid.io/v0.1
name: cere-squid-indexer
version: 1
description: Substrate squid template
build: 
deploy:
  addons:
    postgres: 
  processor:
    cmd: [ "node", "lib/main.js" ]
    env:
      SQD_DEBUG: "*"
  api:
    cmd: [ "npx", "squid-graphql-server", "--dumb-cache", "in-memory", "--dumb-cache-ttl", "1000", "--dumb-cache-size", "100", "--dumb-cache-max-age", "1000" ]

scale:
  processor:
    profile: medium
    storage: 10Gi
  api:
    profile: large
